name: multi_sensor_degradation
description: Dusty site. Camera degrades, LiDAR drops out, radar sees interference.
faults:
  - {sensor: camera, type: noise, level: 5.0, start: 2, ramp: 12}
  - {sensor: camera, type: dropout, level: 0.5, start: 2, ramp: 12}
  - {sensor: lidar, type: dropout, level: 0.6, start: 8, end: 16, ramp: 1}
  - {sensor: radar, type: ghost, level: 2.0, start: 10, ramp: 2}
  - {sensor: radar, type: noise, level: 1.5, start: 10, ramp: 2}
